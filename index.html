<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遊戲選單</title>
<style>
:root{color-scheme:dark;--bg:#0e1410;--panel:#18211b;--line:#3f4636;--gold:#d7b778;--text:#e4e2d7;--muted:#9ca397}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#1d2a20,var(--bg) 60%);color:var(--text);font:15px/1.6 system-ui,"PingFang TC","Noto Sans TC",sans-serif;display:flex;flex-direction:column}
header{text-align:center;padding:48px 16px 12px}
.seal{display:inline-flex;width:44px;height:52px;align-items:center;justify-content:center;font:600 22px Georgia,serif;color:var(--gold);background:#1b251d;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);border:0;margin-bottom:10px}
h1{margin:0;font:500 clamp(26px,5vw,38px) Georgia,"Noto Serif TC",serif;letter-spacing:4px}
header p{margin:8px 0 0;color:var(--muted);font-size:13px;letter-spacing:2px}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:28px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;align-content:start}
.game{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s}
.game:hover,.game:focus-visible{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 14px 40px #0008;outline:0}
.cover{height:190px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:14px}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#18211bf0)}
.cover span{position:relative;z-index:1;font:600 13px system-ui;letter-spacing:2px;color:var(--gold)}
.cover.rift{background:radial-gradient(circle at 70% 30%,#7a3d2a55,transparent 45%),radial-gradient(circle at 25% 70%,#2a4a6a66,transparent 50%),linear-gradient(135deg,#1b1f2b,#0f1318);align-items:center;justify-content:center}
.cover.rift b{position:relative;z-index:1;font:600 96px Georgia,"Noto Serif TC",serif;color:#e8c27a;text-shadow:0 0 30px #e8934a88;margin-bottom:24px}
.cover.rift span{position:absolute;left:14px;bottom:14px}
.body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font:500 22px Georgia,"Noto Serif TC",serif;letter-spacing:2px}
.body p{margin:0;color:#bcc3b0;font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tags i{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:1px 9px}
.go{margin-top:auto;padding-top:10px;color:var(--gold);font-weight:600;letter-spacing:1px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px}
@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<header>
  <div class="seal">Ⅵ</div>
  <h1>遊戲選單</h1>
  <p>挑一款，直接在瀏覽器開玩</p>
</header>
<main>
  <a class="game" href="weaver/">
    <div class="cover" style="background-image:url(covers/weaver.webp)"><span>卡牌 · 即時戰略</span></div>
    <div class="body">
      <h2>織律戰爭</h2>
      <p>雙路戰場、八張牌組。多人模式與 AI 織律者爭奪界律之環，或帶著八隻律靈踏上單人征途，把停下的世界接回去。</p>
      <div class="tags"><i>多人模式</i><i>單人模式</i><i>96 張卡牌</i></div>
      <div class="go">開始遊玩 →</div>
    </div>
  </a>
  <a class="game" href="rift-survivor/">
    <div class="cover rift"><b>楔</b><span>動作 · 生存</span></div>
    <div class="body">
      <h2>接壤之楔</h2>
      <p>在界隙邊境與敵潮周旋，帶領小隊撐到撤離。術式串聯、兵裝天賦、符靈協助，每一趟都不同。</p>
      <div class="tags"><i>動作生存</i><i>小隊</i><i>術式串聯</i></div>
      <div class="go">開始遊玩 →</div>
    </div>
  </a>
</main>
<footer>進度存在各自瀏覽器中，換裝置或清除資料會重置</footer>
</body>
</html>
